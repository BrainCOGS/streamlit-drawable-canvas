# Publishes to PyPI when a GitHub release is created.
name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: streamlit_drawable_canvas/frontend/pnpm-lock.yaml

      # The wheel ships frontend/build (see [tool.setuptools.package-data]), so
      # the JS must be built before the Python package.
      - name: Build the frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: streamlit_drawable_canvas/frontend

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the frontend actually made it into the wheel
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          assets = [n for n in zipfile.ZipFile(wheel).namelist() if "frontend/build" in n]
          print(f"{wheel}: {len(assets)} frontend files")
          if not assets:
              sys.exit("frontend/build is missing from the wheel -- did the JS build run?")
          PY

      - name: Publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*
