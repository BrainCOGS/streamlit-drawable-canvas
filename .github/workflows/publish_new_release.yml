# Publishes to PyPI when a GitHub release is created.
name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no API
      # token or password is stored as a secret. Configure the publisher once at
      # https://pypi.org/manage/project/streamlit-drawable-canvas-fork/settings/publishing/
      # (owner BrainCOGS, repo streamlit-drawable-canvas, workflow
      # publish_new_release.yml, environment pypi).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/streamlit_drawable_canvas/frontend/pnpm-lock.yaml

      # The wheel ships frontend/build (see [tool.setuptools.package-data]), so
      # the JS must be built before the Python package.
      - name: Build the frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: src/streamlit_drawable_canvas/frontend

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the distributions before uploading
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()

          # 0.9.4 shipped two byte-identical top-level packages because a renamed
          # copy was lying around at publish time, and its sdist shipped only the
          # wrong one -- so `pip install --no-binary` failed with ModuleNotFoundError.
          tops = {n.split("/")[0] for n in names if not n.endswith(".dist-info")}
          tops = {t for t in tops if not t.endswith(".dist-info")}
          if tops != {"streamlit_drawable_canvas"}:
              sys.exit(f"wheel must contain exactly one package, found: {sorted(tops)}")

          if not [n for n in names if "frontend/build" in n]:
              sys.exit("frontend/build is missing from the wheel -- did the JS build run?")

          sdist = sorted(glob.glob("dist/*.tar.gz"))[-1]
          with tarfile.open(sdist) as tf:
              members = tf.getnames()
          if not [m for m in members if "/streamlit_drawable_canvas/" in m]:
              sys.exit("sdist does not contain the streamlit_drawable_canvas package")

          print(f"OK: {wheel} and {sdist} both look right")
          PY

      # PyPI stopped accepting username/password uploads, so the old
      # TWINE_USERNAME/TWINE_PASSWORD secrets could not work even if they were set.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
